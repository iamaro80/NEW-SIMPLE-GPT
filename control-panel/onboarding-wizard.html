<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Facility Setup Wizard</title>
  <link rel="stylesheet" href="../assets/css/shadcn.css">
  <script src="../assets/js/theme.js" data-theme-view="control-panel"></script>
  <style>
    :root {
      --w-bg: hsl(var(--background));
      --w-surface: hsl(var(--card));
      --w-surface-soft: hsl(var(--muted));
      --w-text: hsl(var(--foreground));
      --w-muted: hsl(var(--muted-foreground));
      --w-border: hsl(var(--border));
      --w-primary: hsl(var(--primary));
      --w-success: hsl(154 55% 30%);
      --w-success-soft: hsl(154 54% 93%);
      --w-danger: hsl(var(--destructive));
      --w-danger-soft: hsl(0 70% 96%);
    }

    .dark {
      --w-success: hsl(154 55% 75%);
      --w-success-soft: hsl(154 45% 20%);
      --w-danger: hsl(0 65% 78%);
      --w-danger-soft: hsl(0 45% 23%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.45;
      background: var(--w-bg);
      color: var(--w-text);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button { cursor: pointer; }

    .app {
      width: min(1280px, 100%);
      margin: 12px auto 18px;
      padding: 0 16px;
    }

    .page-header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .page-header p {
      margin: 0;
      color: var(--w-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--w-surface-soft);
      color: var(--w-muted);
      font-weight: 600;
      font-size: 10px;
    }

    .button {
      border: 1px solid var(--w-border);
      min-height: 37px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 7px;
      padding: 0 13px;
      background: var(--w-surface);
      color: var(--w-text);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .button:hover { background: var(--w-surface-soft); }
    .button:active { transform: translateY(1px); }
    .button:focus-visible { outline: 2px solid var(--w-primary); outline-offset: 2px; }

    .button.primary {
      background: var(--w-primary);
      color: hsl(var(--primary-foreground));
      border-color: var(--w-primary);
    }

    .button.primary:hover { filter: brightness(0.96); }

    .button.primary:focus-visible { outline-color: var(--w-primary); }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stepper-shell {
      background: var(--w-surface);
      border: 1px solid var(--w-border);
      border-radius: 9px;
      padding: 10px 12px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(8, minmax(96px, 1fr));
      min-width: 800px;
      gap: 4px;
      position: relative;
    }

    .stepper::before {
      content: "";
      position: absolute;
      left: 48px;
      right: 48px;
      top: 14px;
      height: 1px;
      background: var(--w-border);
      z-index: 0;
    }

    .step {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      text-align: center;
      padding: 0 4px;
      font: inherit;
      color: var(--w-muted);
    }

    .step-number {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      margin: 0 auto 6px;
      border: 1px solid var(--w-border);
      background: var(--w-surface);
      display: grid;
      place-items: center;
      color: var(--w-muted);
      font-size: 10px;
      font-weight: 650;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }

    .step-label {
      display: block;
      font-size: 10px;
      line-height: 1.25;
      font-weight: 600;
    }

    .step.active {
      color: var(--w-primary);
    }

    .step.active .step-number {
      border-color: var(--w-primary);
      background: var(--w-primary);
      color: hsl(var(--primary-foreground));
    }

    .step.complete {
      color: var(--w-success);
    }

    .step.complete .step-number {
      border-color: var(--w-primary);
      background: var(--w-primary);
      color: hsl(var(--primary-foreground));
    }

    .step:hover .step-label { color: var(--w-primary); }
    .step:focus-visible { outline: 2px solid var(--w-primary); outline-offset: 2px; border-radius: 6px; }

    .message {
      display: none;
      margin-bottom: 12px;
      padding: 9px 11px;
      border: 1px solid var(--w-border);
      border-radius: 7px;
      font-weight: 550;
      font-size: 11px;
    }

    .message.success {
      display: block;
      background: var(--w-success-soft);
      color: var(--w-success);
      border-color: hsl(154 40% 78%);
    }

    .message.error {
      display: block;
      background: var(--w-danger-soft);
      color: var(--w-danger);
      border-color: hsl(0 60% 84%);
    }

    .dark .message.success { border-color: hsl(154 38% 35%); }
    .dark .message.error { border-color: hsl(0 45% 40%); }

    .panel {
      padding: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--w-border);
      margin-bottom: 14px;
    }

    .eyebrow {
      color: var(--w-primary);
      font-size: 9px;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -.025em;
      font-weight: 650;
    }

    .panel-header p {
      margin: 5px 0 0;
      color: var(--w-muted);
      font-size: 11px;
    }

    .panel-header #stepStatus { align-self: flex-start; }

    .section {
      overflow: hidden;
      margin: 0 0 15px;
      padding: 0;
      border: 1px solid var(--w-border);
      border-radius: 9px;
      background: var(--w-surface);
    }

    .section h3 {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 12px 15px;
      border-bottom: 1px solid var(--w-border);
      background: var(--w-surface-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 14px;
      padding: 15px;
    }

    .facility-config-section .form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field.full { grid-column: 1 / -1; }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 550;
      margin-bottom: 5px;
    }

    .required { color: var(--w-danger); }

    .control {
      width: 100%;
      border: 1px solid var(--w-border);
      border-radius: 6px;
      background: var(--w-surface);
      min-height: 35px;
      padding: 0 9px;
      color: var(--w-text);
      font-size: 11px;
      line-height: 1.4;
      outline: none;
    }

    .control:focus {
      border-color: var(--w-primary);
      box-shadow: 0 0 0 2px hsl(var(--ring) / .18);
    }

    .control:disabled {
      background: var(--w-surface-soft);
      color: var(--w-muted);
      cursor: not-allowed;
    }

    .control:read-only {
      background: var(--w-surface-soft);
      cursor: default;
    }

    textarea.control {
      min-height: 75px;
      padding: 9px;
      resize: vertical;
    }

    input[type="color"].control {
      min-height: 35px;
      padding: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 35px;
      align-self: end;
      padding-top: 0;
    }

    .checkbox-row input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--w-primary);
    }

    .checkbox-row label {
      margin: 0;
      font-size: 10px;
      font-weight: 550;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 13px;
      margin-top: 15px;
      border-top: 1px solid var(--w-border);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .metric {
      background: var(--w-surface);
      border: 1px solid var(--w-border);
      border-radius: 9px;
      padding: 10px 12px;
    }

    .metric-label {
      color: var(--w-muted);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .invalid {
      border-color: var(--w-danger) !important;
      background: var(--w-danger-soft);
    }

    @media (max-width: 760px) {
      .app {
        width: 100%;
        margin-top: 9px;
        padding: 0 10px;
      }

      .page-header,
      .panel-header,
      .panel-footer {
        flex-direction: column;
        align-items: stretch;
      }

      .form-grid,
      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .footer-actions {
        flex-direction: column;
      }

      .button {
        width: auto;
      }
    }

    @media (max-width: 580px) {
      .form-grid,
      .metrics {
        grid-template-columns: 1fr;
      }

      .facility-config-section .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div class="header-actions">
        <span id="progressBadge" class="badge">0 of 8 completed</span>
        <button id="resetButton" type="button" class="button">Reset Progress</button>
      </div>
    </header>

    <section class="stepper-shell" aria-label="Wizard steps">
      <div id="stepper" class="stepper"></div>
    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <section class="panel">
      <div class="panel-header">
        <div>
          <div id="stepEyebrow" class="eyebrow"></div>
          <h2 id="stepTitle"></h2>
          <p id="stepDescription"></p>
        </div>
        <span id="stepStatus" class="badge">Not saved</span>
      </div>

      <div id="formArea"></div>

      <footer class="panel-footer">
        <button id="previousButton" type="button" class="button">Previous</button>
        <div class="footer-actions">
          <button id="saveButton" type="button" class="button">Save progress</button>
          <button id="nextButton" type="button" class="button primary">Save & Next</button>
        </div>
      </footer>
    </section>

    <section class="metrics">
      <div class="metric">
        <div class="metric-label">Current step</div>
        <div id="currentMetric" class="metric-value">1</div>
      </div>
      <div class="metric">
        <div class="metric-label">Completed steps</div>
        <div id="completedMetric" class="metric-value">0</div>
      </div>
      <div class="metric">
        <div class="metric-label">Saved fields</div>
        <div id="fieldMetric" class="metric-value">0</div>
      </div>
    </section>
  </main>

              ["contractCode", "Code", "text", true, null, false, false, true],
              ["contractStart", "Start Date", "date", true],
              ["contractEnd", "End Date", "date", false, null, true],
              ["policies", "Policies", "select", false, ["Available after payer selection"], true],
              ["plans", "Plans", "select", false, ["Available after policy selection"], true],
              ["network", "Network", "select", false, ["Available after plan selection"], true],
              ["contractClass", "Class", "select", false, ["Available after network selection"], true],
              ["premiumFrequency", "Premium Billing Frequency", "select", false, ["Monthly"], true],
              ["encounterType", "Encounter Type", "select", true, ["Outpatient", "Inpatient", "Emergency"]],
              ["nationality", "Nationality", "select", false, ["All", "Saudi", "Non-Saudi"]],
              ["referralDiscount", "Apply Discount for Referral Cases", "checkbox", false],
              ["masterFallback", "Apply Master Pricing Fallback", "checkbox", false],
              ["dedicatedAccount", "Create Dedicated Account for This Contract", "checkbox", false]
            ]
          },
          {
            name: "Price List",
            fields: [
              ["priceList", "Price List", "select", true, ["Master Price List", "Insurance Price List", "Corporate Price List"]],
              ["priceListStart", "Start Date", "date", true],
              ["priceListEnd", "End Date", "date", false, null, true]
            ]
          },
          {
            name: "Discounts",
            fields: [
              ["discountRule", "Discount", "select", false, ["No discount", "5% standard", "10% preferred"]],
              ["discountStart", "Start Date", "date", false],
              ["discountEnd", "End Date", "date", false, null, true]
            ]
          }
        ]
      }
    ];

    const organizationId = new URLSearchParams(window.location.search).get("organizationId");
    const organizationsStorageKey = "xocialive-control-panel-organizations";
    let organizations = [];
    let organization = null;
    try {
      organizations = JSON.parse(localStorage.getItem(organizationsStorageKey) || "[]");
      organization = organizations.find(item => item.id === organizationId) || null;
    } catch { /* Continue with a fresh wizard session if storage is unavailable. */ }

    const savedProgress = organization?.onboardingWizard || {};
    const state = {
      current: Math.max(0, Math.min(steps.length - 1, Number(savedProgress.current) || 0)),
      saved: savedProgress.saved && typeof savedProgress.saved === "object" ? savedProgress.saved : {},
      completed: new Set(Array.isArray(savedProgress.completed) ? savedProgress.completed : [])
    };

    const facilityIdentifierSequenceKey = "xocialive-control-panel-facility-identifier-sequence";
    const numericFacilityIdentifier = value => /^\d+$/.test(String(value ?? "")) ? Number(value) : null;
    function ensureFacilityIdentifier() {
      const currentValues = state.saved[0] || {};
      const currentIdentifier = numericFacilityIdentifier(currentValues.facilityIdentifier);
      const used = new Set();
      let highest = 58; // Existing Facility Settings seed identifiers are 47–58.

      try {
        const facilities = JSON.parse(localStorage.getItem("rcm-facilities:v1") || "[]");
        facilities.forEach(facility => {
          const identifier = numericFacilityIdentifier(facility.facilityIdentifier);
          if (identifier !== null) {
            used.add(identifier);
            highest = Math.max(highest, identifier);
          }
        });
      } catch { /* Use the known seeded range if facility storage is unavailable. */ }

      organizations.forEach(item => {
        if (item.id === organizationId) return;
        const identifier = numericFacilityIdentifier(item.onboardingWizard?.saved?.[0]?.facilityIdentifier);
        if (identifier !== null) {
          used.add(identifier);
          highest = Math.max(highest, identifier);
        }
      });

      let next = Math.max(highest + 1, Number(localStorage.getItem(facilityIdentifierSequenceKey)) || 59);
      if (currentIdentifier !== null && !used.has(currentIdentifier)) {
        localStorage.setItem(facilityIdentifierSequenceKey, String(Math.max(next, currentIdentifier + 1)));
        return String(currentIdentifier);
      }

      while (used.has(next)) next += 1;
      localStorage.setItem(facilityIdentifierSequenceKey, String(next + 1));
      return String(next);
    }

    const savedIdentifier = numericFacilityIdentifier(state.saved[0]?.facilityIdentifier);
    if (savedIdentifier === null) state.saved[0] = { ...(state.saved[0] || {}), facilityIdentifier: ensureFacilityIdentifier() };

    const generatedWizardCodeFields = [
      { step: 1, key: "departmentCode", prefix: "DPT" },
      { step: 6, key: "pricingCode", prefix: "PRC" },
      { step: 7, key: "contractCode", prefix: "CTR" }
    ];
    const generatedWizardFieldKeys = new Set(["facilityIdentifier", ...generatedWizardCodeFields.map(field => field.key)]);
    const defaultWizardFieldValues = {
      country: "Saudi Arabia",
      payerCountry: "Saudi Arabia",
      backgroundColor: "#000000",
      foregroundColor: "#000000",
      totalCost: "0.00"
    };
    const countsAsUserValue = (key, value) => !generatedWizardFieldKeys.has(key)
      && defaultWizardFieldValues[key] !== value
      && value !== ""
      && value !== false
      && value !== null
      && value !== undefined;

    function ensureWizardCode(stepIndex, fieldKey, prefix) {
      const sequenceKey = `xocialive-control-panel-onboarding-code-sequence:${prefix}`;
      const pattern = new RegExp(`^${prefix}-(\\d+)$`);
      const usedCodes = new Set();
      let highest = 0;

      organizations.forEach(item => {
        if (item.id === organizationId) return;
        const savedCode = item.onboardingWizard?.saved?.[stepIndex]?.[fieldKey];
        const match = String(savedCode || "").match(pattern);
        if (!match) return;
        const number = Number(match[1]);
        usedCodes.add(`${prefix}-${String(number).padStart(3, "0")}`);
        highest = Math.max(highest, number);
      });

      const currentCode = String(state.saved[stepIndex]?.[fieldKey] || "");
      const currentMatch = currentCode.match(pattern);
      const storedSequence = Number(localStorage.getItem(sequenceKey)) || 1;
      let sequence = Math.max(storedSequence, highest + 1);

      if (currentMatch) {
        const currentNumber = Number(currentMatch[1]);
        const normalizedCode = `${prefix}-${String(currentNumber).padStart(3, "0")}`;
        if (!usedCodes.has(normalizedCode)) {
          localStorage.setItem(sequenceKey, String(Math.max(sequence, currentNumber + 1)));
          return normalizedCode;
        }
      }

      let nextCode = `${prefix}-${String(sequence).padStart(3, "0")}`;
      while (usedCodes.has(nextCode)) {
        sequence += 1;
        nextCode = `${prefix}-${String(sequence).padStart(3, "0")}`;
      }
      localStorage.setItem(sequenceKey, String(sequence + 1));
      return nextCode;
    }

    const removeLegacySavedFields = (stepIndex, keys) => {
      if (!state.saved[stepIndex]) return;
      state.saved[stepIndex] = { ...state.saved[stepIndex] };
      keys.forEach(key => delete state.saved[stepIndex][key]);
    };
    removeLegacySavedFields(3, ["badgeId", "linkedUser"]);
    removeLegacySavedFields(5, ["hospitalCode", "hospitalDescription"]);
    removeLegacySavedFields(6, ["catalogSearch", "pricingHospitalCode"]);

    const stepper = document.getElementById("stepper");
    const formArea = document.getElementById("formArea");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const nextButton = document.getElementById("nextButton");
    const previousButton = document.getElementById("previousButton");

    function createField(field) {
      const [id, label, type, required, options, disabled, fullWidth, readOnly] = field;
      const wrapper = document.createElement("div");
      wrapper.className = "field" + (fullWidth ? " full" : "");

      if (type === "checkbox") {
        wrapper.className += " checkbox-row";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.id = id;
        input.dataset.field = id;
        input.disabled = !!disabled;

        const labelEl = document.createElement("label");
        labelEl.htmlFor = id;
        labelEl.textContent = label;

        wrapper.append(input, labelEl);
        return wrapper;
      }

      const labelEl = document.createElement("label");
      labelEl.htmlFor = id;
      labelEl.innerHTML = label + (required ? ' <span class="required">*</span>' : "");

      let input;

      if (type === "select") {
        input = document.createElement("select");
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select";
        input.appendChild(placeholder);

        const fieldOptions = id === "practitionerDepartment"
          ? [String(state.saved[1]?.departmentName || "").trim()].filter(Boolean)
          : (options || []);
        fieldOptions.forEach(option => {
          const optionEl = document.createElement("option");
          optionEl.value = option;
          optionEl.textContent = option;
          input.appendChild(optionEl);
        });
      } else if (type === "textarea") {
        input = document.createElement("textarea");
      } else {
        input = document.createElement("input");
        input.type = type;
        if (type === "number") {
          input.min = "0";
          input.step = "0.01";
        }
        if (type === "file") {
          input.accept = "image/*";
        }
      }

      input.id = id;
      input.dataset.field = id;
      input.required = !!required;
      input.disabled = !!disabled;
      input.readOnly = !!readOnly;
      if (readOnly) input.setAttribute("aria-readonly", "true");
      input.className = "control";

      wrapper.append(labelEl, input);
      return wrapper;
    }

    function renderStepper() {
      stepper.innerHTML = "";

      steps.forEach((step, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "step";
        if (index === state.current) button.classList.add("active");
        if (state.completed.has(index)) button.classList.add("complete");

        button.innerHTML = `
          <span class="step-number">${state.completed.has(index) ? "✓" : index + 1}</span>
          <span class="step-label">${step.short}</span>
        `;

        button.addEventListener("click", () => {
          captureCurrent(false);
          state.current = index;
          render();
        });

        stepper.appendChild(button);
      });
    }

    function renderForm() {
      const step = steps[state.current];

      const generatedCodeField = generatedWizardCodeFields.find(field => field.step === state.current);
      if (generatedCodeField) {
        const generatedCode = ensureWizardCode(generatedCodeField.step, generatedCodeField.key, generatedCodeField.prefix);
        if (state.saved[state.current]?.[generatedCodeField.key] !== generatedCode) {
          state.saved[state.current] = { ...(state.saved[state.current] || {}), [generatedCodeField.key]: generatedCode };
          persistProgress();
        }
      }

      document.getElementById("stepEyebrow").textContent = `Step ${state.current + 1} of ${steps.length}`;
      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("stepDescription").textContent = step.description;

      if (state.completed.has(state.current)) {
        document.getElementById("stepStatus").textContent = "Completed";
      } else if (Object.entries(state.saved[state.current] || {}).some(([key, value]) => countsAsUserValue(key, value))) {
        document.getElementById("stepStatus").textContent = "Draft saved";
      } else {
        document.getElementById("stepStatus").textContent = "Not saved";
      }

      formArea.innerHTML = "";

      step.sections.forEach(section => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "section";
        if (section.name === "Facility Configuration") sectionEl.classList.add("facility-config-section");

        const title = document.createElement("h3");
        title.textContent = section.name;

        const grid = document.createElement("div");
        grid.className = "form-grid";

        section.fields.forEach(field => grid.appendChild(createField(field)));

        sectionEl.append(title, grid);
        formArea.appendChild(sectionEl);
      });

      const saved = state.saved[state.current] || {};

      formArea.querySelectorAll("[data-field]").forEach(control => {
        const value = saved[control.dataset.field];
        if (value === undefined || (["country", "payerCountry"].includes(control.dataset.field) && value === "")) {
          if (["country", "payerCountry"].includes(control.dataset.field) && [...control.options].some(option => option.value === "Saudi Arabia")) control.value = "Saudi Arabia";
          return;
        }
        if (control.type === "file") return;

        if (control.type === "checkbox") {
          control.checked = Boolean(value);
        } else {
          control.value = value;
        }
      });

      const material = document.getElementById("materialCost");
      const department = document.getElementById("departmentCost");
      const total = document.getElementById("totalCost");

      if (material && department && total) {
        const calculate = () => {
          total.value = ((Number(material.value) || 0) + (Number(department.value) || 0)).toFixed(2);
        };
        material.addEventListener("input", calculate);
        department.addEventListener("input", calculate);
        calculate();
      }

      const hasTpa = formArea.querySelector('[data-field="hasTpa"]');
      const tpa = formArea.querySelector('[data-field="tpa"]');
      if (hasTpa && tpa) {
        const syncTpa = () => {
          tpa.disabled = !hasTpa.checked;
          tpa.required = hasTpa.checked;
          if (!hasTpa.checked) tpa.value = "";
        };
        hasTpa.addEventListener("change", syncTpa);
        syncTpa();
      }

      previousButton.disabled = state.current === 0;
      nextButton.textContent = state.current === steps.length - 1 ? "Save & Finish" : "Save & Next";
    }

    function captureCurrent(validate) {
      const values = {};
      let valid = true;

      formArea.querySelectorAll("[data-field]").forEach(control => {
        control.classList.remove("invalid");

        if (control.type === "file") {
          values[control.dataset.field] = control.files[0]?.name || "";
        } else if (control.type === "checkbox") {
          values[control.dataset.field] = control.checked;
        } else {
          values[control.dataset.field] = control.value;
        }

        if (validate && control.required && !control.value) {
          valid = false;
          control.classList.add("invalid");
        }
      });

      state.saved[state.current] = values;
      return valid;
    }

    function saveCurrent(moveNext) {
      const savedStep = state.current + 1;
      const valid = captureCurrent(true);

      if (!valid) {
        state.completed.delete(state.current);
        persistProgress();
        showMessage("Complete all required fields before marking this step as completed.", "error");
        updateMetrics();
        renderStepper();
        return;
      }

      state.completed.add(state.current);

      if (moveNext && state.current < steps.length - 1) {
        state.current += 1;
      }

      persistProgress();
      showMessage(`Step ${savedStep} saved successfully.`, "success");

      render();
    }

    function onboardingStatus() {
      if (state.completed.size === steps.length) return "Ready for Review";
      const hasSavedValues = Object.values(state.saved).some(values => Object.entries(values || {}).some(([key, value]) => countsAsUserValue(key, value)));
      return hasSavedValues || state.completed.size ? "In Progress" : (organization?.onboardingStatus || "Not Started");
    }

    function persistProgress() {
      if (!organization || !organizationId) return;
      organization.onboardingWizard = { current: state.current, saved: state.saved, completed: [...state.completed] };
      organization.onboardingStatus = onboardingStatus();
      try {
        const index = organizations.findIndex(item => item.id === organizationId);
        if (index >= 0) organizations[index] = organization;
        localStorage.setItem(organizationsStorageKey, JSON.stringify(organizations));
      } catch { /* Keep the current wizard usable even when browser storage is unavailable. */ }
      window.parent.postMessage({ type: "control-panel-onboarding-update", organizationId, onboardingStatus: organization.onboardingStatus }, window.location.origin);
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function updateMetrics() {
      const savedFields = Object.values(state.saved).reduce((total, values) => {
        return total + Object.entries(values || {}).filter(([key, value]) => countsAsUserValue(key, value)).length;
      }, 0);

      document.getElementById("currentMetric").textContent = state.current + 1;
      document.getElementById("completedMetric").textContent = state.completed.size;
      document.getElementById("fieldMetric").textContent = savedFields;
      document.getElementById("progressBadge").textContent = `${state.completed.size} of ${steps.length} completed`;
    }

    function render() {
      renderStepper();
      renderForm();
      updateMetrics();
    }

    saveButton.addEventListener("click", () => saveCurrent(false));
    nextButton.addEventListener("click", () => saveCurrent(true));

    previousButton.addEventListener("click", () => {
      captureCurrent(false);
      if (state.current > 0) state.current -= 1;
      render();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!window.confirm("Clear saved onboarding progress for this organization?")) return;
      state.current = 0;
      state.saved = { 0: { facilityIdentifier: state.saved[0]?.facilityIdentifier || ensureFacilityIdentifier() } };
      state.completed.clear();
      if (organization) delete organization.onboardingWizard;
      if (organization) organization.onboardingStatus = "Not Started";
      persistProgress();
      showMessage("Onboarding progress has been reset.", "success");
      render();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") window.parent.postMessage({ type: "control-panel-onboarding-close" }, window.location.origin);
    });

    persistProgress();
    render();
  </script>
</body>
</html>
